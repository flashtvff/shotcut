name: build-capflash-windows

on:
  workflow_dispatch:

jobs:
  build:
    if: ${{ github.repository_owner != 'mltframework' }}
    timeout-minutes: 360
    runs-on: windows-latest
    outputs:
      version: ${{ steps.set_version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            autotools base-devel bzip2 coreutils git gzip tar unzip xz zip
            perl-List-MoreUtils perl-XML-Parser
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-yasm
            mingw-w64-ucrt-x86_64-cairo
            mingw-w64-ucrt-x86_64-eigen3
            mingw-w64-ucrt-x86_64-dlfcn
            mingw-w64-ucrt-x86_64-fftw
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-gettext-tools
            mingw-w64-ucrt-x86_64-harfbuzz
            mingw-w64-ucrt-x86_64-ladspa-sdk
            mingw-w64-ucrt-x86_64-lame
            mingw-w64-ucrt-x86_64-libarchive
            mingw-w64-ucrt-x86_64-libepoxy
            mingw-w64-ucrt-x86_64-libexif
            mingw-w64-ucrt-x86_64-libimagequant
            mingw-w64-ucrt-x86_64-libsamplerate
            mingw-w64-ucrt-x86_64-libtheora
            mingw-w64-ucrt-x86_64-libvorbis
            mingw-w64-ucrt-x86_64-libvpl
            mingw-w64-ucrt-x86_64-libvpx
            mingw-w64-ucrt-x86_64-libwebp
            mingw-w64-ucrt-x86_64-libxml2
            mingw-w64-ucrt-x86_64-lilv
            mingw-w64-ucrt-x86_64-openblas
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-potrace
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-charts
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-imageformats
            mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-qt6-multimedia-wmf
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-qt6-translations
            mingw-w64-ucrt-x86_64-qt6-websockets
            mingw-w64-ucrt-x86_64-rubberband
            mingw-w64-ucrt-x86_64-sox
            mingw-w64-ucrt-x86_64-svt-av1
            mingw-w64-ucrt-x86_64-vid.stab
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-x264
            mingw-w64-ucrt-x86_64-x265
            mingw-w64-ucrt-x86_64-zimg

      - name: Set version
        id: set_version
        shell: msys2 {0}
        run: |
          VERSION="$(date +"%y.%-m.%-d")"
          echo VERSION=$VERSION
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cleanup dependencies
        shell: msys2 {0}
        run: |
          pacman --noconfirm -Rdd mingw-w64-ucrt-x86_64-aom

      - name: Build
        shell: msys2 {0}
        run: |
          echo INSTALL_DIR=\"$(pwd)/build\"
          echo INSTALL_DIR=\"$(pwd)/build\" > build-shotcut.conf
          echo SHOTCUT_VERSION=\"$VERSION\" >> build-shotcut.conf
          echo SHOTCUT_HEAD=0 >> build-shotcut.conf
          echo SHOTCUT_REVISION=origin/${{ github.head_ref || github.ref_name }} >> build-shotcut.conf
          echo SHOTCUT_REPO=\"https://github.com/${{ github.repository }}.git\" >> build-shotcut.conf
          bash scripts/build-shotcut-msys2.sh

      - name: Package Cap Flash
        shell: msys2 {0}
        run: |
          set -e
          cd build
          rm -rf CapFlash
          mv Shotcut CapFlash
          mv CapFlash/shotcut.exe CapFlash/CapFlash.exe
          mkdir -p CapFlash/capflash/realesrgan
          cp ../packaging/windows/capflash/ultrahd.ps1 CapFlash/capflash/
          cp ../packaging/windows/capflash/LEIA-ME.txt CapFlash/
          curl -fsSL -o esr.zip https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-windows.zip
          echo "abc02804e17982a3be33675e4d471e91ea374e65b70167abc09e31acb412802d  esr.zip" | sha256sum -c -
          unzip -q esr.zip -d CapFlash/capflash/realesrgan
          rm -f CapFlash/capflash/realesrgan/*.jpg CapFlash/capflash/realesrgan/*.mp4 CapFlash/capflash/realesrgan/vcomp140d.dll
          zip -qr CapFlash-win64-$VERSION.zip CapFlash

      - name: Upload Cap Flash artifact
        uses: actions/upload-artifact@v7
        with:
          name: CapFlash-win64
          path: ./build/CapFlash-win64-${{ steps.set_version.outputs.version }}.zip
